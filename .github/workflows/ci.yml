name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore XuiEditor.slnx --locked-mode

      - name: Build Debug
        run: dotnet build XuiEditor.slnx --configuration Debug --no-restore

      - name: Test Debug
        run: >-
          dotnet run
          --project tests\XuiEditor.Tests\XuiEditor.Tests.csproj
          --configuration Debug
          --no-restore
          --no-build
          --

      - name: Build Release and package executable
        run: dotnet build XuiEditor.slnx --configuration Release --no-restore

      - name: Test Release
        run: >-
          dotnet run
          --project tests\XuiEditor.Tests\XuiEditor.Tests.csproj
          --configuration Release
          --no-restore
          --no-build
          --

      - name: Verify standalone executable
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\win-x64'
          $files = @(Get-ChildItem -LiteralPath $publishDirectory -File)

          if ($files.Count -ne 1 -or $files[0].Name -ne 'DyingLightXuiEditor.exe') {
            $found = ($files.Name | Sort-Object) -join ', '
            throw "Expected only DyingLightXuiEditor.exe in $publishDirectory; found: $found"
          }

      - name: Upload standalone executable
        uses: actions/upload-artifact@v7
        with:
          name: DyingLightXuiEditor-win-x64
          path: artifacts/publish/win-x64/DyingLightXuiEditor.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
